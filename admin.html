<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Admin | MJ Vestidos</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600&family=Playfair+Display:wght@600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="admin.css">
</head>
<body>

    <!-- PANTALLA DE BLOQUEO -->
    <div id="auth-overlay">
        <h2>MJ Vestidos</h2>
        <p class="auth-subtitle">Panel de Administración</p>
        <input type="password" id="admin-pin" placeholder="Clave de acceso">
        <button id="btn-unlock" class="btn btn-gold btn-unlock">Entrar al Panel</button>
    </div>

    <header class="admin-header">
        <h1>Admin | MJ Vestidos</h1>
        <div class="header-nav">
            <a href="ventas.html" class="btn-nav-sales">🏷️ Ventas</a>
            <a href="index.html">Ver Catálogo</a>
        </div>
    </header>

    <div class="container">
        <!-- FORMULARIO CREAR / EDITAR -->
        <div class="card">
            <h2 id="form-title" class="card-title">Agregar Nuevo Artículo</h2>
            <form id="dress-form">
                <input type="hidden" id="edit-id">

                <div class="form-grid">
                    <div class="form-group">
                        <label for="d-type">Tipo de Artículo *</label>
                        <input type="text" id="d-type" placeholder="Ej. Vestido, Accesorio, Bolsa" value="Vestido" required>
                    </div>
                    <div class="form-group">
                        <label for="d-name">Nombre del Artículo *</label>
                        <input type="text" id="d-name" placeholder="Ej. Rojo Mangas" required>
                    </div>
                    <div class="form-group">
                        <label for="d-color">Color *</label>
                        <input type="text" id="d-color" placeholder="Ej. Rojo" required>
                    </div>
                    <div class="form-group">
                        <label for="d-size">Talla(s) * <small>(separa con coma si hay varias)</small></label>
                        <input type="text" id="d-size" placeholder="Ej. XS, S o M" required>
                    </div>
                    <div class="form-group">
                        <label for="d-price">Precio de Renta / noche (MXN) *</label>
                        <input type="number" id="d-price" placeholder="450" required>
                    </div>
                    <div class="form-group">
                        <label for="d-deposit">Depósito Reembolsable (MXN) *</label>
                        <input type="number" id="d-deposit" placeholder="200" required>
                    </div>
                    <div class="form-group">
                        <label for="d-status">Estado del Producto *</label>
                        <select id="d-status" required>
                            <option value="Disponible">Disponible</option>
                            <option value="Rentado">Rentado</option>
                            <option value="SACAR DE INVENTARIO">SACAR DE INVENTARIO</option>
                        </select>
                    </div>
                    <div class="form-group full">
                        <label for="d-comments">Extra / Comentarios</label>
                        <textarea id="d-comments" placeholder="Detalles de la tela, corte, notas adicionales..."></textarea>
                    </div>

                    <div class="form-group full hidden-block" id="existing-images-block">
                        <label>Fotos actuales (haz clic en X para quitar alguna):</label>
                        <div class="current-images" id="current-images-container"></div>
                    </div>

                    <div class="form-group full">
                        <label for="d-photos">Subir Foto(s) del Artículo <small>(puedes elegir varias a la vez)</small></label>
                        <input type="file" id="d-photos" accept="image/*" multiple>
                    </div>
                </div>

                <div class="btn-row">
                    <button type="submit" id="btn-save" class="btn btn-gold">Guardar Artículo</button>
                    <button type="button" id="btn-cancel" class="btn btn-cancel">Cancelar Edición</button>
                </div>
            </form>
        </div>

        <!-- INVENTARIO ACTUAL + SELECCIÓN + BUSCADOR -->
        <div class="card">
            <div class="inventory-header">
                <h2>Inventario Actual (<span id="count-dresses">0</span>)</h2>

                <div class="inventory-tools">
                    <button type="button" id="btn-move-sales" class="btn btn-move-sales">🏷️ Mover a Ventas (0)</button>
                    <button type="button" id="btn-toggle-select" class="btn btn-select-mode">☑️ Seleccionar</button>

                    <div class="search-wrapper">
                        <svg class="search-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="11" cy="11" r="8"></circle>
                            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                        </svg>
                        <input type="text" id="search-input" class="search-input" placeholder="Buscar nombre, tipo, color, talla, estado, ID...">
                        <button type="button" id="clear-search" class="clear-search-btn" title="Limpiar búsqueda">&times;</button>
                    </div>
                </div>
            </div>

            <div id="inventory-list" class="inventory-list">
                <p class="status-msg">Cargando inventario...</p>
            </div>
        </div>
    </div>

    <!-- MODAL PARA RESERVAR Y FIRMAR CONTRATO -->
    <div id="rent-modal" class="admin-modal">
        <div class="admin-modal-content">
            <span class="modal-close" id="close-rent-modal">&times;</span>
            <h2 class="card-title">Registrar Renta y Firmar Contrato</h2>

            <div class="rent-dress-banner">
                <h3 id="rent-dress-title">Nombre del Vestido</h3>
                <p id="rent-dress-meta">Tipo | Precio | Depósito</p>
            </div>

            <form id="rent-form">
                <div class="form-group">
                    <label>Selecciona la Talla a Rentar *</label>
                    <div id="rent-size-chips" class="size-chips"></div>
                    <input type="hidden" id="rent-selected-size" required>
                </div>

                <div class="form-grid">
                    <div class="form-group">
                        <label for="r-client">Nombre Completo del Cliente *</label>
                        <input type="text" id="r-client" required>
                    </div>
                    <div class="form-group">
                        <label for="r-phone">Teléfono *</label>
                        <input type="tel" id="r-phone" required>
                    </div>
                    <div class="form-group full">
                        <label for="r-address">Dirección *</label>
                        <input type="text" id="r-address" required>
                    </div>
                    <div class="form-group">
                        <label for="r-payment">Método de Pago *</label>
                        <select id="r-payment" required>
                            <option value="" disabled selected>Elige un método</option>
                            <option value="Efectivo">Efectivo</option>
                            <option value="Transferencia Bancaria">Transferencia Bancaria</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="r-ine">Foto del INE *</label>
                        <input type="file" id="r-ine" accept="image/*" required>
                    </div>
                    <div class="form-group">
                        <label for="r-start-date">Fecha de Inicio (Entrega) *</label>
                        <input type="date" id="r-start-date" required>
                    </div>
                    <div class="form-group">
                        <label for="r-end-date">Fecha de Fin (Devolución) *</label>
                        <input type="date" id="r-end-date" required>
                    </div>
                    <div class="form-group">
                        <label for="r-pickup-time">Hora de Entrega *</label>
                        <input type="time" id="r-pickup-time" required>
                    </div>
                    <div class="form-group">
                        <label for="r-return-time">Hora de Devolución *</label>
                        <input type="time" id="r-return-time" required>
                    </div>
                </div>

                <div class="rent-summary-box">
                    <p><strong>Días de renta:</strong> <span id="r-days">0</span></p>
                    <p><strong>Subtotal renta:</strong> <span id
