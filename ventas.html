<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ventas | MJ Vestidos</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600&family=Playfair+Display:wght@600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="ventas.css">
</head>
<body>

    <!-- PANTALLA DE BLOQUEO -->
    <div id="auth-overlay">
        <h2>MJ Vestidos</h2>
        <p class="auth-subtitle">Sección de Ventas</p>
        <input type="password" id="admin-pin" placeholder="Clave de acceso">
        <button id="btn-unlock" class="btn btn-gold btn-unlock">Entrar a Ventas</button>
    </div>

    <header class="admin-header">
        <h1>Ventas | MJ Vestidos</h1>
        <div class="header-nav">
            <a href="admin.html" class="btn-nav-admin">⬅️ Volver a Admin</a>
            <a href="index.html">Ver Catálogo</a>
        </div>
    </header>

    <div class="container">
        <!-- FORMULARIO CREAR / EDITAR EN VENTAS -->
        <div class="card">
            <h2 id="form-title" class="card-title">Agregar Artículo a Ventas</h2>
            <form id="sales-form">
                <input type="hidden" id="edit-id">

                <div class="form-grid">
                    <div class="form-group">
                        <label for="s-type">Tipo de Artículo *</label>
                        <input type="text" id="s-type" placeholder="Ej. Vestido, Accesorio, Bolsa" value="Vestido" required>
                    </div>
                    <div class="form-group">
                        <label for="s-name">Nombre del Artículo *</label>
                        <input type="text" id="s-name" placeholder="Ej. Rojo Mangas" required>
                    </div>
                    <div class="form-group">
                        <label for="s-color">Color *</label>
                        <input type="text" id="s-color" placeholder="Ej. Rojo" required>
                    </div>
                    <div class="form-group">
                        <label for="s-size">Talla(s) * <small>(separa con coma si hay varias)</small></label>
                        <input type="text" id="s-size" placeholder="Ej. XS, S o M" required>
                    </div>
                    <div class="form-group">
                        <label for="s-price">Precio de Venta (MXN) *</label>
                        <input type="number" id="s-price" placeholder="1200" required>
                    </div>
                    <div class="form-group">
                        <label for="s-deposit">Depósito / Anticipo (MXN)</label>
                        <input type="number" id="s-deposit" placeholder="0" value="0">
                    </div>
                    <div class="form-group">
                        <label for="s-status">Estado del Producto *</label>
                        <select id="s-status" required>
                            <option value="En Venta">En Venta</option>
                            <option value="Vendido">Vendido</option>
                            <option value="Apartado">Apartado</option>
                        </select>
                    </div>
                    <div class="form-group full">
                        <label for="s-comments">Extra / Comentarios</label>
                        <textarea id="s-comments" placeholder="Notas de venta, comprador, detalles..."></textarea>
                    </div>

                    <div class="form-group full hidden-block" id="existing-images-block">
                        <label>Fotos actuales (haz clic en X para quitar alguna):</label>
                        <div class="current-images" id="current-images-container"></div>
                    </div>

                    <div class="form-group full">
                        <label for="s-photos">Subir Foto(s) del Artículo <small>(puedes elegir varias a la vez)</small></label>
                        <input type="file" id="s-photos" accept="image/*" multiple>
                    </div>
                </div>

                <div class="btn-row">
                    <button type="submit" id="btn-save" class="btn btn-gold">Guardar en Ventas</button>
                    <button type="button" id="btn-cancel" class="btn btn-cancel">Cancelar Edición</button>
                </div>
            </form>
        </div>

        <!-- INVENTARIO DE VENTAS + BUSCADOR -->
        <div class="card">
           <div class="inventory-header">
                <h2>Artículos en Ventas (<span id="count-sales">0</span>)</h2>

                <div class="inventory-tools">
                    <button type="button" id="btn-move-dresses" class="btn btn-move-dresses">👗 Mover a Vestidos (0)</button>
                    <button type="button" id="btn-toggle-select" class="btn btn-select-mode">☑️ Seleccionar</button>

                    <div class="search-wrapper">
                        <svg class="search-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="11" cy="11" r="8"></circle>
                            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                        </svg>
                        <input type="text" id="search-input" class="search-input" placeholder="Buscar nombre, tipo, color, talla, precio, ID...">
                        <button type="button" id="clear-search" class="clear-search-btn" title="Limpiar búsqueda">&times;</button>
                    </div>
                </div>
            </div>

            <div id="sales-list" class="inventory-list">
                <p class="status-msg">Cargando artículos en ventas...</p>
            </div>
        </div>
    </div>

    <script src="ventas.js"></script>
</body>
</html>
